<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__MSG_extName__</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1 class="popup-title">
        <span class="popup-icon">💬</span>
        __MSG_extName__
      </h1>
    </div>

    <div class="popup-content">
      <div class="status-section">
        <div class="status-item">
          <span class="status-label">__MSG_platformLabel__</span>
          <span class="status-value" id="platformName">__MSG_detecting__</span>
        </div>
        <div class="status-item">
          <span class="status-label">__MSG_messagesLabel__</span>
          <span class="status-value" id="messageCount">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">__MSG_statusLabel__</span>
          <span class="status-value" id="sidebarStatus">Enabled</span>
        </div>
      </div>

      <div class="actions-section">
        <button id="toggleBtn" class="action-button primary">
          <span class="button-icon">👁️</span>
          <span class="button-text">__MSG_hideSidebar__</span>
        </button>
        <button id="refreshBtn" class="action-button secondary">
          <span class="button-icon">🔄</span>
          <span class="button-text">__MSG_refreshMessages__</span>
        </button>
      </div>

      <div class="info-section">
        <h3 class="info-title">__MSG_usageTitle__</h3>
        <ul class="info-list">
          <li>__MSG_usage1__</li>
          <li>__MSG_usage2__</li>
          <li>__MSG_usage3__</li>
          <li>__MSG_usage4__</li>
        </ul>
      </div>

      <div class="support-section">
        <p class="support-text">
          💡 <strong>__MSG_tipTitle__</strong> __MSG_tipText__
        </p>
      </div>
    </div>

    <div class="popup-footer">
      <small class="footer-text">__MSG_footerText__</small>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
